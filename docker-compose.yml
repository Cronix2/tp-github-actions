services:
  web-blue:
    build: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPLOY_COLOR: blue
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  web-green:
    build: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPLOY_COLOR: green
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-blue:
        condition: service_healthy
      web-green:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network: